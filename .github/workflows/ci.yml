name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Verify formatting
        run: |
          git ls-files '*.cpp' '*.hpp' '*.h' '*.c' '*.cc' '*.hh' '*.inl' |
            xargs -r clang-format --dry-run --Werror

  windows-debug:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure Visual Studio debug preset
        run: cmake --preset vs2022-debug

      - name: Build test target
        run: cmake --build --preset vs2022-debug --target ScaffoldTests

      - name: Run tests
        run: ctest --preset vs2022-debug

  windows-analysis:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure analysis preset
        run: cmake --preset vs2022-analysis

      - name: Build with /analyze enabled
        run: cmake --build --preset vs2022-analysis --target ScaffoldTests

  linux-sanitizers:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            clang \
            libasound2-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            wayland-protocols

      - name: Configure sanitizer preset
        run: cmake --preset native-asan

      - name: Build test target
        run: cmake --build --preset native-asan --target ScaffoldTests

      - name: Run tests under sanitizers
        run: ctest --preset native-asan

  linux-clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            clang-tidy \
            ninja-build \
            libasound2-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            wayland-protocols

      - name: Configure clang-tidy preset
        run: cmake --preset native-clang-tidy

      - name: Build test target with clang-tidy
        run: cmake --build --preset native-clang-tidy --target ScaffoldTests